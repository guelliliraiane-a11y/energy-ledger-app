<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Energy Ledger</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:18px;position:sticky;top:0;z-index:2}nav{display:flex;gap:6px;overflow:auto;margin-top:12px}button{border:0;border-radius:10px;padding:10px 12px;background:#2563eb;color:#fff;font-weight:600}nav button{background:#374151;white-space:nowrap}.active{background:#2563eb!important}.wrap{max-width:800px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 10px}h2{margin-top:4px}.big{font-size:28px;font-weight:800}.muted{color:#6b7280}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:9px 0}.danger{background:#dc2626}.hidden{display:none}.pill{display:inline-block;background:#e5e7eb;padding:5px 8px;border-radius:99px;margin:3px;font-size:12px}</style></head><body><header><b>⚡ Energy Ledger</b><div class="muted" style="color:#d1d5db">Ton suivi calories, activité et poids</div><nav id="nav"></nav></header><main class="wrap"><section id="repas"></section><section id="tef" class="hidden"></section><section id="activite" class="hidden"></section><section id="bmr" class="hidden"></section><section id="poids" class="hidden"></section><section id="deficit" class="hidden"></section></main><script>
const KEY='energyLedgerV1';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{foods:[],meals:[],activity:0,weight:[],profile:{weight:64.5,height:175,age:23,sex:'H'}};function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}function kcal(f,g){return {k:f.kcal*g/100,p:f.p*g/100,c:f.c*g/100,fat:f.fat*g/100}}const base=[['Œuf','Protéines',143,12.6,0.7,9.5],['Poulet','Protéines',120,26,0,2],['Thon naturel','Protéines',116,26,0,1],['Fromage blanc 0%','Laitiers',48,8,4,0.2],['Lait demi-écrémé','Laitiers',46,3.2,4.8,1.6],['Pain de mie','Féculents',265,9,49,3.2],['Pâtes cuites','Féculents',158,5.8,30.9,0.9],['Riz cuit','Féculents',130,2.7,28,0.3],['Pomme de terre cuite','Féculents',87,1.9,20,0.1],['Nutella','Confiseries',539,6.3,57.5,30.9],['Banane','Fruits',89,1.1,22.8,0.3],['Pomme','Fruits',52,0.3,14,0.2],['Brocoli','Légumes',35,2.4,7.2,0.4],['Ketchup','Sauces',112,1.3,26,0.1]].map(x=>({name:x[0],cat:x[1],kcal:x[2],p:x[3],c:x[4],fat:x[5]}));S.foods=[...base,...S.foods.filter(x=>!base.some(b=>b.name===x.name))];const tabs=[['repas','🍽️ Repas'],['tef','🔥 TEF'],['activite','⌚ Activité'],['bmr','⚙️ Métabolisme'],['poids','⚖️ Poids'],['deficit','📉 Déficit']];function nav(){document.querySelector('#nav').innerHTML=tabs.map(([id,n],i)=>`<button class="${i?'':'active'}" onclick="show('${id}',this)">${n}</button>`).join('')}function show(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b?.classList.add('active');render()}function totals(){return S.meals.reduce((a,x)=>{a.k+=x.k;a.p+=x.p;a.c+=x.c;a.f+=x.f;return a},{k:0,p:0,c:0,f:0})}function render(){nav();let t=totals();document.querySelector('#repas').innerHTML=`<div class="card"><h2>Aujourd’hui</h2><div class="big">${Math.round(t.k)} kcal</div><span class="pill">P ${t.p.toFixed(1)} g</span><span class="pill">G ${t.c.toFixed(1)} g</span><span class="pill">L ${t.f.toFixed(1)} g</span></div><div class="card"><h2>Ajouter un aliment</h2><input id="q" placeholder="Rechercher un aliment..." oninput="foodList()"><div id="fl"></div><hr><b>Créer mon aliment</b><div class="grid"><input id="fn" placeholder="Nom"><input id="fc" placeholder="Catégorie"><input id="fk" type="number" placeholder="kcal/100g"><input id="fp" type="number" placeholder="protéines/100g"><input id="fg" type="number" placeholder="glucides/100g"><input id="ff" type="number" placeholder="lipides/100g"></div><button onclick="customFood()">Créer</button></div><div class="card"><h2>Repas du jour</h2>${S.meals.length?S.meals.map((x,i)=>`<div class="row"><span>${x.name} — ${x.g} g<br><small>${Math.round(x.k)} kcal · P ${x.p.toFixed(1)}g</small></span><button class="danger" onclick="S.meals.splice(${i},1);save()">×</button></div>`).join(''):'<span class="muted">Aucun aliment ajouté.</span>'}</div>`;foodList();
let tef=t.p*4*.25+t.c*4*.075+t.f*9*.02;document.querySelector('#tef').innerHTML=`<div class="card"><h2>Thermogenèse des aliments</h2><div class="big">${Math.round(tef)} kcal</div><p>Estimation : protéines 25 %, glucides 7,5 %, lipides 2 %.</p></div>`;
document.querySelector('#activite').innerHTML=`<div class="card"><h2>⌚ Activité Apple Watch</h2><p>Entre les calories d’activité indiquées par ta montre.</p><input id="act" type="number" value="${S.activity||0}"><button onclick="S.activity=+document.querySelector('#act').value||0;save()">Enregistrer</button><p>Calories retenues après marge de sécurité de -30 % : <b>${Math.round(S.activity*.7)} kcal</b></p></div>`;
let p=S.profile;let bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='H'?5:-161);document.querySelector('#bmr').innerHTML=`<div class="card"><h2>Métabolisme de base</h2><div class="grid"><input id="bw" type="number" value="${p.weight}" placeholder="Poids kg"><input id="bh" type="number" value="${p.height}" placeholder="Taille cm"><input id="ba" type="number" value="${p.age}" placeholder="Âge"><select id="bs"><option value="H" ${p.sex==='H'?'selected':''}>Homme</option><option value="F" ${p.sex==='F'?'selected':''}>Femme</option></select></div><button onclick="S.profile={weight:+bw.value,height:+bh.value,age:+ba.value,sex:bs.value};save()">Calculer</button><p class="big">${Math.round(bmr)} kcal/jour</p><small>Mifflin-St Jeor</small></div>`;
document.querySelector('#poids').innerHTML=`<div class="card"><h2>Poids</h2><input id="wd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="wv" type="number" step="0.1" placeholder="Poids en kg"><button onclick="addWeight()">Ajouter</button></div><div class="card"><h2>Historique</h2>${S.weight.slice().reverse().map((x,i)=>`<div class="row">${x.date} — <b>${x.v} kg</b></div>`).join('')||'Aucune mesure.'}</div>`;
let bal=t.k-(bmr+S.activity*.7+tef);document.querySelector('#deficit').innerHTML=`<div class="card"><h2>Déficit calorique du jour</h2><div class="big">${Math.round(bal)} kcal</div><p>${bal<0?'Déficit':'Surplus'} : ${Math.abs(Math.round(bal))} kcal</p><hr><p>Apport : ${Math.round(t.k)} kcal<br>BMR : ${Math.round(bmr)} kcal<br>Activité corrigée : ${Math.round(S.activity*.7)} kcal<br>TEF : ${Math.round(tef)} kcal</p></div>`}function foodList(){let q=(document.querySelector('#q')?.value||'').toLowerCase();let arr=S.foods.filter(f=>f.name.toLowerCase().includes(q)).slice(0,12);let el=document.querySelector('#fl');if(el)el.innerHTML=arr.map((f,i)=>`<div class="row"><span>${f.name}<br><small>${f.kcal} kcal/100g · ${f.p}g P</small></span><button onclick="addFood(${S.foods.indexOf(f)})">Ajouter</button></div>`).join('')}function addFood(i){let f=S.foods[i];let g=prompt(`Quantité de ${f.name} en grammes ?`,'100');if(g===null)return;g=+g;if(!g||g<0)return;let z=kcal(f,g);S.meals.push({name:f.name,g,k:z.k,p:z.p,c:z.c,f:z.fat});save()}function customFood(){let f={name:fn.value.trim(),cat:fc.value||'Autre',kcal:+fk.value,p:+fp.value,c:+fg.value,fat:+ff.value};if(!f.name||!f.kcal)return alert('Remplis au minimum le nom et les kcal.');S.foods.push(f);save()}function addWeight(){let v=+wv.value;if(!v)return;S.weight.push({date:wd.value,v});save()}render();</script></body></html>
